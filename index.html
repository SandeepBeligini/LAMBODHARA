<header>

</header>

<div class="container">

            id="searchInput"
            placeholder="భక్తుని పేరు / గోత్రం కోసం వెతకండి..."

            <strong id="shownCount">0</strong>
        </span>

        </div>
    </div>

</div>

<footer>
    © లంబోధర ఉత్సవ కమిటీ
</footer>


<script>

/* ============================================================
   GOOGLE SHEET CSV URL
   ============================================================ */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQrl7VpCJicM0w5OIG8t_ktrwP8hoUCe7SnPp9JoymrWmxF_bIqlVA5laD-3wQbuHYCJRDQxvfe7kLC/pub?gid=0&single=true&output=csv";


/* ============================================================
   VARIABLES
   ============================================================ */

let devotees = [];

const devoteeList = document.getElementById("devoteeList");
const searchInput = document.getElementById("searchInput");
const totalCount = document.getElementById("totalCount");
const shownCount = document.getElementById("shownCount");


/* ============================================================
   LOAD GOOGLE SHEET
   ============================================================ */

async function loadDevotees() {

    devoteeList.innerHTML = `
        <div class="status">
            భక్తుల పేర్లు లోడ్ అవుతున్నాయి...
        </div>
    `;

    try {

        const url = CSV_URL + "&cache=" + Date.now();

        const response = await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "Google Sheet could not be loaded. HTTP " +
                response.status
            );
        }

        const csvText = await response.text();

        console.log("Google Sheet CSV:");
        console.log(csvText);

        if (!csvText.trim()) {
            throw new Error("Google Sheet returned empty data");
        }

        const rows = parseCSV(csvText);

        console.log("Parsed rows:");
        console.log(rows);

        if (!rows || rows.length === 0) {
            throw new Error("No rows found");
        }


        /* ----------------------------------------------------
           EXPECTED COLUMNS

           A = S.No
           B = Devotee Name
           C = Gender
           D = Gothram
        ---------------------------------------------------- */

        devotees = [];

        rows.slice(1).forEach((row, index) => {

            if (!row) return;

            const sno =
                cleanCell(row[0]) || (index + 1);

            const name =
                cleanCell(row[1]);

            const gender =
                cleanCell(row[2]);

            const gothram =
                cleanCell(row[3]);


            // Skip completely empty rows
            if (!name) {
                return;
            }


            devotees.push({
                sno: sno,
                name: name,
                gender: gender,
                gothram: gothram
            });

        });


        console.log("Devotees loaded:", devotees);


        if (devotees.length === 0) {

            devoteeList.innerHTML = `
                <div class="status">
                    భక్తుల పేర్లు కనిపించలేదు.
                    <br><br>
                    Google Sheet లో B Column
                    <b>Devotee Name</b> ఉందో చూడండి.
                </div>
            `;

            totalCount.textContent = "0";
            shownCount.textContent = "0";

            return;
        }


        totalCount.textContent = devotees.length;

        displayDevotees(devotees);

    }

    catch (error) {

        console.error(
            "Devotee loading error:",
            error
        );

        devoteeList.innerHTML = `
            <div class="status error">

                భక్తుల పేర్లు లోడ్ కాలేదు.

                <br><br>

                Google Sheet Publish to Web
                settings ను తనిఖీ చేయండి.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>
        `;

        totalCount.textContent = "0";
        shownCount.textContent = "0";
    }
}


/* ============================================================
   DISPLAY DEVOTEES
   ============================================================ */

function displayDevotees(list) {

    shownCount.textContent = list.length;

    if (list.length === 0) {

        devoteeList.innerHTML = `
            <div class="status">
                భక్తులు ఎవరూ కనిపించలేదు.
            </div>
        `;

        return;
    }


    devoteeList.innerHTML = list.map(devotee => {

        let details = [];

        if (devotee.gender) {
            details.push(
                escapeHTML(devotee.gender)
            );
        }

        if (devotee.gothram) {

            let gothramText =
                devotee.gothram;

            if (
                !gothramText.includes("గోత్రం")
            ) {
                gothramText =
                    "గోత్రం: " + gothramText;
            }

            details.push(
                escapeHTML(gothramText)
            );
        }


        return `

            <div class="devotee">

                <div class="number">
                    ${escapeHTML(
                        String(devotee.sno)
                    )}
                </div>

                <div>

                    <div class="devotee-name">
                        ${escapeHTML(
                            devotee.name
                        )}
                    </div>

                    ${
                        details.length > 0
                        ?
                        `
                        <div class="devotee-details">
                            ${details.join(" • ")}
                        </div>
                        `
                        :
                        ""
                    }

                </div>

            </div>

        `;

    }).join("");
}


/* ============================================================
   SEARCH
   ============================================================ */

searchInput.addEventListener(
    "input",
    function () {

        const searchText =
            this.value
                .trim()
                .toLowerCase();


        if (!searchText) {

            displayDevotees(devotees);

            return;
        }


        const filtered =
            devotees.filter(devotee => {

                const name =
                    devotee.name
                        .toLowerCase();

                const gender =
                    devotee.gender
                        .toLowerCase();

                const gothram =
                    devotee.gothram
                        .toLowerCase();

                const sno =
                    String(devotee.sno)
                        .toLowerCase();


                return (
                    name.includes(searchText) ||
                    gender.includes(searchText) ||
                    gothram.includes(searchText) ||
                    sno.includes(searchText)
                );

            });


        displayDevotees(filtered);

    }
);


/* ============================================================
   CLEAR SEARCH
   ============================================================ */

function clearSearch() {

    searchInput.value = "";

    displayDevotees(devotees);

    searchInput.focus();
}


/* ============================================================
   CSV PARSER
   Handles commas and quoted values correctly
   ============================================================ */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const nextChar =
            text[i + 1];


        if (char === '"' && insideQuotes && nextChar === '"') {

            cell += '"';

            i++;

            continue;
        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;
        }


        if (char === "," && !insideQuotes) {

            row.push(cell);

            cell = "";

            continue;
        }


        if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                nextChar === "\n"
            ) {
                i++;
            }

            row.push(cell);

            cell = "";

            if (row.some(
                value =>
                    value.trim() !== ""
            )) {
                rows.push(row);
            }

            row = [];

            continue;
        }


        cell += char;

    }


    if (cell !== "" || row.length > 0) {

        row.push(cell);

        if (row.some(
            value =>
                value.trim() !== ""
        )) {
            rows.push(row);
        }

    }


    return rows;
}


/* ============================================================
   CLEAN CELL
   ============================================================ */

function cleanCell(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    return String(value)
        .replace(/^\uFEFF/, "")
        .trim();
}


/* ============================================================
   SECURITY / HTML ESCAPE
   ============================================================ */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

loadDevotees();


/* ============================================================
   AUTOMATIC REFRESH
   Every 5 minutes
   ============================================================ */

setInterval(
    loadDevotees,
    5 * 60 * 1000
);

</script>

</body>
</html>
